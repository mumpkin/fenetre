[workspace]
resolver = "3"
members = ["fenetre-glsl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mumpkin/fenetre"

[workspace.dependencies]
shaderc = "0.10.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
